<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XWASM Game Shell</title>
<style>
:root{font-family:system-ui,sans-serif;background:#090b0f;color:#eee}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#18202b,#090b0f 60%)}
#app{min-height:100vh;display:flex;flex-direction:column}
header{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#11151b;border-bottom:1px solid #2b3139}
header strong{letter-spacing:.04em}
.status{margin-left:auto;font:12px Consolas,monospace;color:#8ecae6}
button{font:inherit;background:#20262e;color:#eee;border:1px solid #3a424c;border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{background:#2a323c}
#stage{flex:1;display:grid;place-items:center;padding:18px}
#gameFrame{position:relative;width:min(1100px,96vw);aspect-ratio:16/9;background:#000;border:1px solid #343b44;box-shadow:0 16px 50px #0008;overflow:hidden}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
#overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#78818c;font:13px Consolas,monospace}
#hud{position:absolute;left:10px;top:8px;font:11px Consolas,monospace;color:#aeb7c1;background:#0008;padding:5px 7px;border-radius:4px}
#controls{position:absolute;right:10px;top:8px;display:flex;gap:5px}
#packageDir,#packageFiles{display:none}
#terminal{position:fixed;left:0;right:0;bottom:0;background:#090a0c;border-top:2px solid #b33;box-shadow:0 -12px 40px #000;max-height:36vh;z-index:20;display:none}
#terminal.visible{display:block}
.termHead{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#17191d}
.termHead strong{color:#ff8b8b}.termHead span{margin-left:auto;color:#888;font:11px Consolas,monospace}
#errors{margin:0;padding:10px;max-height:29vh;overflow:auto;white-space:pre-wrap;font:12px/1.45 Consolas,monospace;color:#ffb0b0}
#settings{position:fixed;left:12px;bottom:12px;z-index:10;background:#11151bcc;border:1px solid #303640;border-radius:7px;padding:8px;display:flex;gap:7px;align-items:center}
input{display:none}
.small{font-size:11px;color:#8d96a0}
</style>
</head>
<body>
<div id="app">
<header>
<strong>XWASM GAME SHELL</strong>
<button id="selectPackage">Select game package</button>
<button id="load">Load selected</button>
<button id="start">Start</button>
<input id="packageDir" type="file" webkitdirectory directory multiple>
<!-- Updated to accept .xapi files -->
<input id="packageFiles" type="file" multiple accept=".xwasm,.xpl,.wasm,.bin,.json,.js,.xapi">
<button id="pause">Pause</button>
<button id="fullscreen">Fullscreen</button>
<span id="packageName" class="small">No package selected</span>
<div id="status" class="status">idle</div>
</header>
<div id="stage">
<div id="gameFrame" tabindex="0">
<canvas id="game" width="1280" height="720"></canvas>
<div id="overlay">XWASM host surface ready</div>
<div id="hud">WINDOW · INPUT · AUDIO · OPENGL</div>
<div id="controls"><button id="mute">Audio</button></div>
</div>
</div>
<div id="settings"><span class="small">Host bridges active simultaneously</span><button id="showDiagnostics">Diagnostics</button><button id="copyReport">Copy report</button><button id="showErrors">Errors</button></div>
<div id="diagnostics" style="position:fixed;right:12px;bottom:52px;width:min(720px,92vw);max-height:62vh;z-index:15;background:#0b0d10ee;border:1px solid #39414b;border-radius:8px;display:none;box-shadow:0 18px 60px #000">
<div class="termHead"><strong style="color:#8ecae6">XWASM X86 DIAGNOSTICS</strong><span id="diagCount">idle</span><button id="refreshDiagnostics">Refresh</button><button id="closeDiagnostics">Close</button></div>
<pre id="diagText" style="margin:0;padding:10px;max-height:54vh;overflow:auto;white-space:pre-wrap;font:11px/1.45 Consolas,monospace;color:#c8d1da"></pre>
</div>
</div>

<div id="terminal">
<div class="termHead"><strong>XWASM ERROR TERMINAL</strong><span id="errorCount">0 errors</span><button id="hideErrors">Hide</button><button id="clearErrors">Clear</button></div>
<pre id="errors"></pre>
</div>

<script>
(()=>{"use strict";
const $=id=>document.getElementById(id);
const td=new TextDecoder();
// Updated state to include xapis array
const state={
 runtime:null,payload:null,bridge:null,manifest:null,files:[],packageName:"",module:null,instance:null,exports:null,memory:null,
 running:false,audio:null,muted:false,events:[],errors:[],xapis:[],
 gl:null,ctx:null,diagnostics:{exportNames:[],last:null},window:{width:1280,height:720,visible:true,title:"XWASM Game"}
};
const hex=v=>"0x"+(Number(v)>>>0).toString(16).padStart(8,"0");
function status(s){$("status").textContent=s}
function error(s,e){
 const msg="[ERROR] "+s+(e?"\n"+(e.stack||e):"");
 state.errors.push(msg);$("errors").textContent=state.errors.join("\n");
 $("errorCount").textContent=state.errors.length+" error"+(state.errors.length===1?"":"s");
 $("terminal").classList.add("visible");status("error");
}
function log(s){$("status").textContent=s}
async function sha256(bytes){return new Uint8Array(await crypto.subtle.digest("SHA-256",bytes))}
async function unpack(buf,kind,name){
 const b=new Uint8Array(buf),v=new DataView(buf);
 if(b.length<62||td.decode(b.slice(0,6))!=="XWSC01")throw Error(name+": invalid XWSC01");
 if(v.getUint16(6,true)!==1)throw Error(name+": unsupported XWSC01 version");
 const k=v.getUint8(8),comp=v.getUint8(9),rawSize=Number(v.getBigUint64(14,true)),storedSize=Number(v.getBigUint64(22,true));
 const names={1:"xwasm",2:"xpl",3:"xpak",4:"xapi"};
 if(names[k]!==kind)throw Error(name+": wrong container kind");
 if(storedSize!==b.length-62)throw Error(name+": stored size mismatch");
 const stored=b.slice(62);
 let raw=stored;
 if(comp===1)raw=new Uint8Array(await new Response(new Blob([stored]).stream().pipeThrough(new DecompressionStream("deflate"))).arrayBuffer());
 if(comp!==0&&comp!==1)throw Error(name+": unsupported compression");
 if(raw.length!==rawSize)throw Error(name+": raw size mismatch");
 const h=await sha256(raw),want=b.slice(30,62);
 for(let i=0;i<32;i++)if(h[i]!==want[i])throw Error(name+": SHA-256 mismatch");
 return raw.buffer;
}
function validatePE(b){
 const v=new DataView(b),u=new Uint8Array(b);
 if(u[0]!==0x4d||u[1]!==0x5a)throw Error("payload is not MZ");
 const p=v.getUint32(0x3c,true);
 if(td.decode(u.slice(p,p+4))!=="PE\0\0")throw Error("payload is not PE");
 if(v.getUint16(p+4,true)!==0x14c||v.getUint16(p+24,true)!==0x10b)throw Error("payload is not PE32/i386");
}
function pushEvent(type,data={}){
 state.events.push({type,t:performance.now(),...data});
 if(state.events.length>256)state.events.shift();
}
function playBeep(freq,dur){
 if(state.muted)return;
 try{
  if(!state.audio)state.audio=new(window.AudioContext||window.webkitAudioContext)();
  const o=state.audio.createOscillator(),g=state.audio.createGain();
  o.frequency.value=Math.max(40,Math.min(12000,freq));g.gain.value=.06;
  o.connect(g);g.connect(state.audio.destination);o.start();o.stop(state.audio.currentTime+Math.max(0,dur)/1000);
 }catch(e){error("audio bridge failed",e)}
}
function createHost(){
 const canvas=$("game"),ctx=canvas.getContext("2d");
 state.ctx=ctx;
 state.gl=canvas.getContext("webgl2")||canvas.getContext("webgl");
 const rgba=c=>[c>>>16&255,c>>>8&255,c&255,255];
 const host={
  memory:new WebAssembly.Memory({initial:2048,maximum:4096}),

  xwasm_log:(level,ptr,len)=>{
   try{const s=td.decode(new Uint8Array(state.memory.buffer,ptr,len));if(Number(level)<0)error("guest: "+s);else log("guest: "+s)}
   catch(e){error("xwasm_log",e)}
  },

  /* Window bridge */
  xwasm_window_create:(w,h,titlePtr,titleLen)=>{
   state.window.width=w>>>0;state.window.height=h>>>0;
   canvas.width=Math.max(1,w>>>0);canvas.height=Math.max(1,h>>>0);
   state.ctx=canvas.getContext("2d");state.gl=canvas.getContext("webgl2")||canvas.getContext("webgl");
   pushEvent("window_create",{w,h});return 1;
  },
  xwasm_window_show:()=>{state.window.visible=true;$("overlay").style.display="none";return 1},
  xwasm_window_hide:()=>{state.window.visible=false;$("overlay").style.display="grid";return 1},
  xwasm_window_present:()=>{return 0},
  xwasm_window_set_title:()=>0,

  /* Input bridge: poll returns 1 and writes a compact event record when a buffer is supplied. */
  xwasm_input_poll:(ptr,remove)=>{
   const ev=state.events[0];if(!ev)return 0;
   if(ptr&&state.memory){
    const v=new DataView(state.memory.buffer);
    const type={keydown:1,keyup:2,mousedown:3,mouseup:4,mousemove:5,quit:6}[ev.type]||0;
    v.setUint32(ptr>>>0,type,true);v.setInt32((ptr+4)>>>0,ev.x||0,true);v.setInt32((ptr+8)>>>0,ev.y||0,true);
    v.setUint32((ptr+12)>>>0,ev.code?ev.code.charCodeAt(0):ev.button||0,true);
   }
   if(remove)state.events.shift();return 1;
  },
  xwasm_input_quit:()=>{pushEvent("quit");return 0},

  /* Audio bridge */
  xwasm_audio_beep:(f,d)=>{playBeep(f,d);return 0},

  /* Software graphics fallback */
  xwasm_gfx_create:(w,h)=>{host.xwasm_window_create(w,h,0,0);return 1},
  xwasm_gfx_clear:c=>{const q=rgba(c);state.ctx.fillStyle="rgb("+q[0]+","+q[1]+","+q[2]+")";state.ctx.fillRect(0,0,canvas.width,canvas.height)},
  xwasm_gfx_rect:(l,t,r,b,c)=>{const q=rgba(c);state.ctx.fillStyle="rgb("+q[0]+","+q[1]+","+q[2]+")";state.ctx.fillRect(l,t,r-l,b-t)},
  xwasm_gfx_pixel:(x,y,c)=>{const q=rgba(c);state.ctx.fillStyle="rgb("+q[0]+","+q[1]+","+q[2]+")";state.ctx.fillRect(x,y,1,1)},
  xwasm_gfx_present:()=>0,

  /* OpenGL-family host bridge. Immediate-mode calls are represented on the
     browser surface; real GL entry points can be wired here as the runtime's
     opengl32 ABI is promoted. */
  xwasm_gl_begin:mode=>{state.ctx.save();return 0},
  xwasm_gl_end:()=>{state.ctx.restore();return 0},
  xwasm_gl_clear_color:(r,g,b,a)=>{state.ctx._xwClear=[r,g,b,a];return 0},
  xwasm_gl_clear:mask=>{const c=state.ctx._xwClear||[0,0,0,1];state.ctx.fillStyle="rgba("+c[0]*255+","+c[1]*255+","+c[2]*255+","+c[3]+")";state.ctx.fillRect(0,0,canvas.width,canvas.height);return 0},
  xwasm_gl_viewport:(x,y,w,h)=>{canvas._xwViewport={x,y,w,h};return 0},
  xwasm_gl_color3f:(r,g,b)=>{state.ctx._xwColor="rgb("+r*255+","+g*255+","+b*255+")";return 0},
  xwasm_gl_vertex2f:(x,y)=>{state.ctx.fillStyle=state.ctx._xwColor||"#fff";state.ctx.fillRect(x,y,2,2);return 0},
  xwasm_gl_flush:()=>0,
  xwasm_gl_finish:()=>0
 };
 return host;
}
function buildImports(mod){
 const host=createHost(),env=host;
 state.memory=env.memory;
 
 // Added logic to process parsed .xapi files and map them to the env
 for (const xapi of state.xapis) {
  for (const lib in xapi.libraries) {
   for (const fnName in xapi.libraries[lib].functions) {
    const fnDef = xapi.libraries[lib].functions[fnName];
    const flatName = fnDef.bridge.replace(/\./g, "_"); 
    
    if (fnDef.bridge.startsWith("xw.math.")) {
     const jsMathFunc = fnDef.bridge.split(".")[2];
     env[flatName] = Math[jsMathFunc] || (() => 0);
    }
   }
  }
 }

 const imports=WebAssembly.Module.imports(mod);
 for(const i of imports){
  if(i.module!=="env")continue;
  if(i.kind==="memory"){env[i.name]=state.memory;continue}
  if(i.kind==="function"&&!env[i.name]){
   env[i.name]=(...args)=>{error("unimplemented host import env."+i.name+"("+args.map(hex).join(",")+")");return 0};
  }
 }
 return {env};
}
function fileByNames(names){
  const wanted=names.map(x=>x.toLowerCase());
  return state.files.find(f=>wanted.includes(f.name.toLowerCase())||wanted.includes(f.webkitRelativePath.split("/").pop().toLowerCase()));
}
function selectPackage(){
  const i=$("packageDir");
  i.value="";
  i.click();
}
function selectLooseFiles(){
  const i=$("packageFiles");
  i.value="";
  i.click();
}
async function readSelectedPackage(){
  try{
   const files=state.files;
   if(!files.length)throw Error("select an XWASM game package folder first");
   
   // Added logic to load and parse .xapi files
   state.xapis = [];
   const xapiFiles = files.filter(f => f.name.toLowerCase().endsWith('.xapi'));
   for (const f of xapiFiles) {
       state.xapis.push(JSON.parse(await f.text()));
   }

   const rf=fileByNames(["runtime.xwasm","runtime.wasm"]);
   const pf=fileByNames(["payload.xpl","payload.bin"]);
   const mf=fileByNames(["manifest.json"]);
   const bf=fileByNames(["bridge.js"]);
   if(!rf)throw Error("package is missing runtime.xwasm/runtime.wasm");
   if(!pf)throw Error("package is missing payload.xpl/payload.bin");
   state.runtime=rf.name.toLowerCase().endsWith(".xwasm")
     ? await unpack(await rf.arrayBuffer(),"xwasm",rf.name)
     : await rf.arrayBuffer();
   state.payload=pf.name.toLowerCase().endsWith(".xpl")
     ? await unpack(await pf.arrayBuffer(),"xpl",pf.name)
     : await pf.arrayBuffer();
   state.bridge=bf||null;
   state.manifest=mf?JSON.parse(await mf.text()):null;
   validatePE(state.payload);
  state.module=await WebAssembly.compile(state.runtime);
  state.instance=await WebAssembly.instantiate(state.module,buildImports(state.module));
  state.exports=state.instance.exports;
  if(typeof state.exports.xwasm_init==="function")state.exports.xwasm_init();
  state.diagnostics.exportNames=Object.keys(state.exports).filter(n=>/x86|cpu|trace|diag|fault|error|indirect|mem/i.test(n)).sort();
  renderDiagnostics("package loaded");
  $("overlay").textContent="XWASM package loaded";
  $("packageName").textContent=state.packageName||"Package loaded";
  log("loaded: "+(state.packageName||"package"));
 }catch(e){error("load failed",e)}
}
function start(){
 try{
  if(!state.exports)throw Error("load package first");
  const p=new Uint8Array(state.payload),ptr=0x100000;
  new Uint8Array(state.memory.buffer,ptr,p.length).set(p);
  const rc=state.exports.x86_load_pe(ptr,p.length);
  if(rc!==0)throw Error("x86_load_pe returned "+rc);
  state.running=true;$("overlay").style.display="none";log("running");
  requestAnimationFrame(tick);
 }catch(e){error("start failed",e)}
}
function tick(){
 if(!state.running)return;
 try{
  const rc=state.exports.x86_run?.(500);
  if(rc<0){
   state.running=false;
   const err=state.exports.x86_get_cpu_error?.()||0;
   error("XWASM CPU stopped: rc="+rc+" cpu_error="+hex(err)+" eip="+hex(state.exports.x86_get_eip?.()||0));
   return;
  }
 }catch(e){state.running=false;error("runtime exception",e);return}
 requestAnimationFrame(tick);
}
function isDiagnosticExport(n){
 return /^(x86|cpu|x87|xmm|crt|last_|trace|stress|mem|import|reloc|dll|load_error|halted|steps)/i.test(n)
   && /(?:get|read|debug|diag|trace|stress|stats|count|error|fault|eip|opcode|dispatch|semantic|indirect|import|mem|halt|step|load|reloc|dll|errno|exit)/i.test(n);
}
function callDiagnostic(name,...args){
 const fn=state.exports&&state.exports[name];
 if(typeof fn!=="function")return undefined;
 try{return fn(...args)}catch(e){return "<call failed: "+(e.message||e)+"}"}
}
function readDiagnostics(){
 const ex=state.exports;if(!ex)return {error:"runtime not loaded"};
 const out={};
 for(const n of Object.keys(ex)){
  if(!isDiagnosticExport(n)||typeof ex[n]!=="function")continue;
  try{
   const type=ex[n].length;
   if(type!==0)continue;
   const v=ex[n]();
   if(typeof v==="number"||typeof v==="bigint"||typeof v==="string")out[n]=String(v);
  }catch(e){out[n]="<call failed: "+(e.message||e)+">"}
 }
 const traceCount=Number(callDiagnostic("x86_get_trace_count")||0);
 const traceDepth=32;
 const trace=[];
 for(let i=0;i<Math.min(traceCount,traceDepth);i++){
  trace.push({
   index:i,eip:callDiagnostic("x86_get_trace_eip",i),
   nextEip:callDiagnostic("x86_get_trace_next_eip",i),
   opcode:callDiagnostic("x86_get_trace_opcode",i),
   dispatch:callDiagnostic("x86_get_trace_dispatch",i),
   flags:callDiagnostic("x86_get_trace_flags",i),
   postFlags:callDiagnostic("x86_get_trace_post_flags",i),
   eax:callDiagnostic("x86_get_trace_eax",i),
   ecx:callDiagnostic("x86_get_trace_ecx",i),
   edx:callDiagnostic("x86_get_trace_edx",i),
   ebx:callDiagnostic("x86_get_trace_ebx",i),
   postEax:callDiagnostic("x86_get_trace_post_eax",i),
   postEcx:callDiagnostic("x86_get_trace_post_ecx",i),
   postEdx:callDiagnostic("x86_get_trace_post_edx",i),
   postEbx:callDiagnostic("x86_get_trace_post_ebx",i)
  });
 }
 out.__trace=trace;
 const currentBytes=[];
 for(let i=0;i<32;i++){
  const v=callDiagnostic("x86_get_current_byte",i);
  if(v===undefined||Number(v)===0xffffffff)break;
  currentBytes.push(Number(v)>>>0);
 }
 out.__currentBytes=currentBytes;
 const stack=[];
 for(let i=0;i<16;i++){
  const v=callDiagnostic("x86_get_stack_dword",i);
  if(v===undefined||Number(v)===0xffffffff)break;
  stack.push(Number(v)>>>0);
 }
 out.__stack=stack;
 return out;
}
function readProfile(){
 const ex=state.exports;if(!ex)return [];
 const countFn=ex.x86_get_profile_count,usedFn=ex.x86_get_profile_used;
 if(typeof countFn!=="function"||typeof usedFn!=="function")return [];
 const slots=1024,rows=[];
 const str=(i)=>{
  const n=Number(callDiagnostic("x86_get_profile_semantic_id_len",i)||0);let s="";
  for(let j=0;j<n;j++)s+=String.fromCharCode(Number(callDiagnostic("x86_get_profile_semantic_id_char",i,j))||0);
  return s||"UNKNOWN";
 };
 for(let i=0;i<slots;i++){
  if(!Number(usedFn(i)))continue;
  rows.push({
   slot:i,map:Number(callDiagnostic("x86_get_profile_map",i)||0),
   opcode:Number(callDiagnostic("x86_get_profile_opcode",i)||0),
   modrm:Number(callDiagnostic("x86_get_profile_modrm",i)||0),
   hasModrm:Number(callDiagnostic("x86_get_profile_has_modrm",i)||0),
   dispatch:Number(callDiagnostic("x86_get_profile_dispatch",i)||0),
   count:Number(callDiagnostic("x86_get_profile_count_at",i)||0),
   firstEip:Number(callDiagnostic("x86_get_profile_first_eip",i)||0),
   lastEip:Number(callDiagnostic("x86_get_profile_last_eip",i)||0),
   minLen:Number(callDiagnostic("x86_get_profile_min_length",i)||0),
   maxLen:Number(callDiagnostic("x86_get_profile_max_length",i)||0),
   semantic:str(i)
  });
 }
 rows.sort((a,b)=>b.count-a.count||a.map-b.map||a.opcode-b.opcode||a.modrm-b.modrm);
 return rows;
}
function profileLine(p){
 const map=p.map===0?"0":p.map===1?"0F":"0F "+p.map.toString(16).padStart(2,"0").toUpperCase();
 let bytes=map+" "+p.opcode.toString(16).padStart(2,"0").toUpperCase();
 if(p.hasModrm)bytes+=" /"+((p.modrm>>3)&7)+" (ModRM "+p.modrm.toString(16).padStart(2,"0").toUpperCase()+")";
 return bytes+" | "+p.semantic+" | count="+p.count+" | len="+p.minLen+(p.maxLen!==p.minLen?"-"+p.maxLen:"")+" | first="+hex(p.firstEip)+" | last="+hex(p.lastEip)+" | dispatch="+p.dispatch;
}
function buildFullReport(){
 const d=readDiagnostics(),p=readProfile();
 const lines=[];
 lines.push("XWASM EXECUTION REPORT");
 lines.push("Generated: "+new Date().toISOString());
 lines.push("Package: "+(state.packageName||"unknown"));
 lines.push("Runtime exports: "+Object.keys(state.exports||{}).length);
 lines.push("");
 lines.push("=== RUNTIME DIAGNOSTICS ===");
 for(const k of Object.keys(d).filter(k=>!k.startsWith("__")).sort())lines.push(k+" = "+d[k]);
 lines.push("");
 lines.push("=== INSTRUCTION PROFILE ===");
 lines.push("Unique executed instruction forms: "+p.length);
 lines.push("Profile is aggregated by map/opcode/ModRM/semantic ID; counts are executions.");
 for(let i=0;i<p.length;i++)lines.push(String(i+1).padStart(4,"0")+" "+profileLine(p[i]));
 lines.push("");
 lines.push("=== RECENT TRACE ===");
 for(const t of d.__trace||[])lines.push(
  String(t.index).padStart(2,"0")+" EIP="+hex(t.eip)+" NEXT="+hex(t.nextEip)+" OP="+hex(t.opcode)+
  " DISPATCH="+t.dispatch+" FLAGS="+hex(t.flags)+" -> "+hex(t.postFlags)+
  " EAX="+hex(t.eax)+" -> "+hex(t.postEax)
 );
 lines.push("");
 lines.push("=== CURRENT BYTES ===");
 const eip=Number(d.x86_get_eip)>>>0;
 const bytes=d.__currentBytes||[];
 for(let i=0;i<bytes.length;i++)lines.push(hex((eip+i)>>>0)+" "+bytes[i].toString(16).padStart(2,"0").toUpperCase());
 lines.push("");
 lines.push("=== STACK ===");
 for(let i=0;i<(d.__stack||[]).length;i++)lines.push(String(i).padStart(2,"0")+": "+hex(d.__stack[i]));
 lines.push("");
 lines.push("=== HOST EVENTS (RECENT) ===");
 for(const ev of state.events)lines.push(JSON.stringify(ev));
 lines.push("");
 lines.push("=== ERRORS ===");
 if(state.errors.length)lines.push(...state.errors);else lines.push("(none)");
 return lines.join("\n");
}
async function copyReport(){
 try{
  const report=buildFullReport();
  if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(report);
  else{
   const ta=document.createElement("textarea");ta.value=report;ta.style.position="fixed";ta.style.opacity="0";
   document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();
  }
  $("copyReport").textContent="Copied!";
  setTimeout(()=>{if($("copyReport"))$("copyReport").textContent="Copy report"},1200);
  log("full execution report copied");
 }catch(e){error("copy report failed",e)}
}
function renderDiagnostics(reason){
 const d=readDiagnostics();
 state.diagnostics.last={reason,t:Date.now(),data:d};
 const keys=Object.keys(d).filter(k=>!k.startsWith("__")).sort();
 let s="REASON: "+reason+"\\nTIME: "+new Date().toLocaleTimeString()+"\\n";
 s+="\\n=== RUNTIME EXPORT DIAGNOSTICS ("+keys.length+") ===\\n";
 for(const k of keys)s+=k+" = "+d[k]+"\\n";
 if(d.__currentBytes&&d.__currentBytes.length){
  s+="\\n=== BYTES @ EIP ===\\n";
  const eip=Number(d.x86_get_eip)>>>0;
  for(let i=0;i<d.__currentBytes.length;i++){
   if(i%16===0)s+=hex((eip+i)>>>0)+": ";
   s+=Number(d.__currentBytes[i]).toString(16).padStart(2,"0")+" ";
   if(i%16===15||i===d.__currentBytes.length-1)s+="\\n";
  }
 }
 if(d.__stack&&d.__stack.length){
  s+="\\n=== STACK DWORDS @ ESP ===\\n";
  for(let i=0;i<d.__stack.length;i++)s+=i.toString().padStart(2,"0")+": "+hex(d.__stack[i])+"\\n";
 }
 if(d.__trace&&d.__trace.length){
  s+="\\n=== TRACE ("+d.__trace.length+") ===\\n";
  for(const t of d.__trace){
   s+=t.index.toString().padStart(2,"0")+" EIP="+hex(t.eip)+" NEXT="+hex(t.nextEip)+" OP="+hex(t.opcode)+" DISPATCH="+t.dispatch+" FLAGS="+hex(t.flags)+" -> "+hex(t.postFlags)+"\\n";
  }
 }
 const eip=d.x86_get_eip,op=d.x86_get_last_decoded_opcode,err=d.x86_get_cpu_error;
 if(eip!==undefined||op!==undefined||err!==undefined){
  s+="\\n=== FAILURE TRIAGE ===\\n";
  if(eip!==undefined)s+="EIP       "+hex(eip)+"\\n";
  if(op!==undefined)s+="OPCODE    "+hex(op)+"\\n";
  if(err!==undefined)s+="CPU_ERROR "+hex(err)+"\\n";
  if(Number(op)===0xff&&d.__currentBytes.length>1){
   const m=d.__currentBytes[1];
   s+="FF MODRM  "+hex(m)+" (mod="+(m>>6)+" reg="+((m>>3)&7)+" rm="+(m&7)+")\\n";
   s+="FF FORM   /"+((m>>3)&7)+"\\n";
  }
 }
 $("diagText").textContent=s;
 $("diagCount").textContent=keys.length+" exported + trace/bytes/stack";
 return d;
}
function pause(){state.running=false;log("paused")}

$("selectPackage").onclick=selectPackage;
$("packageDir").addEventListener("change",e=>{
 const files=Array.from(e.target.files||[]);
 state.files=files;
 state.packageName=files[0]?.webkitRelativePath?.split("/")[0]||"selected package";
 $("packageName").textContent=state.packageName+" ("+files.length+" files)";
 log("package selected");
});
$("packageFiles").addEventListener("change",e=>{
 const files=Array.from(e.target.files||[]);
 state.files=files;
 state.packageName="selected files";
 $("packageName").textContent=files.map(f=>f.name).join(", ");
 log("files selected");
});
$("load").onclick=readSelectedPackage;$("start").onclick=start;$("pause").onclick=pause;
$("fullscreen").onclick=()=>{$("gameFrame").requestFullscreen?.().catch(e=>error("fullscreen",e))};
$("mute").onclick=()=>{state.muted=!state.muted;$("mute").textContent=state.muted?"Muted":"Audio"};
$("showDiagnostics").onclick=()=>{$("diagnostics").style.display="block";renderDiagnostics("manual")};
$("copyReport").onclick=copyReport;
$("refreshDiagnostics").onclick=()=>renderDiagnostics("manual refresh");
$("closeDiagnostics").onclick=()=>$("diagnostics").style.display="none";
$("showErrors").onclick=()=>$("terminal").classList.add("visible");
$("hideErrors").onclick=()=>$("terminal").classList.remove("visible");
$("clearErrors").onclick=()=>{state.errors.length=0;$("errors").textContent="";$("errorCount").textContent="0 errors";$("terminal").classList.remove("visible")};
window.addEventListener("error",e=>error(e.message||"window error"));
window.addEventListener("unhandledrejection",e=>error("unhandled rejection",e.reason));
window.addEventListener("keydown",e=>{pushEvent("keydown",{key:e.key,code:e.code});if(e.code==="F12")e.preventDefault()});
window.addEventListener("keyup",e=>pushEvent("keyup",{key:e.key,code:e.code}));
$("gameFrame").addEventListener("mousemove",e=>{const r=$("gameFrame").getBoundingClientRect();pushEvent("mousemove",{x:Math.round(e.clientX-r.left),y:Math.round(e.clientY-r.top)})});
$("gameFrame").addEventListener("mousedown",e=>{const r=$("gameFrame").getBoundingClientRect();pushEvent("mousedown",{x:Math.round(e.clientX-r.left),y:Math.round(e.clientY-r.top),button:e.button})});
$("gameFrame").addEventListener("mouseup",e=>{const r=$("gameFrame").getBoundingClientRect();pushEvent("mouseup",{x:Math.round(e.clientX-r.left),y:Math.round(e.clientY-r.top),button:e.button})});
})();
</script>
