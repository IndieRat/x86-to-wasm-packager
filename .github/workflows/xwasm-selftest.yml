name: XWASM self-test

on:
  push:
    branches:
      - main
      - xwasm-selftest-env
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM/Clang and LLD
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld python3



      - name: Validate x86 instruction database
        run: |
          python3 tool/xwasm_generate_x86_opcode_map.py
          python3 tool/xwasm_validate_instruction_db.py

      - name: Build XWASM x86 runtime
        run: |
          python3 tool/xwasm_build_x86_runtime.py \
            --clang "$(command -v clang)" \
            --output dist/x86-runtime-selftest/runtime.wasm

      - name: Run WASM memory self-test
        run: |
          node tests/xwasm_memory_selftest.js dist/x86-runtime-selftest/runtime.wasm

      - name: Build CPU + guest-memory stress package
        run: |
          python3 tool/xwasm_build_cpu_stress.py \
            --clang "$(command -v clang)" \
            --output dist/xwasm-cpu-stress

      - name: Run CPU + guest-memory stress gate
        run: |
          node tests/xwasm_cpu_stress.js \
            dist/xwasm-cpu-stress/runtime.wasm \
            dist/xwasm-cpu-stress/resources/__x86__/payload.exe

      - name: Build x87 PE32 fixture
        run: |
          python3 tool/xwasm_build_x87_fixture.py \
            --clang "$(command -v clang)" \
            --lld-link "$(command -v lld-link)" \
            --output dist/x87-fixture/x87_float_fixture.exe

      - name: Build C5 PE32 fixture
        run: |
          python3 tool/xwasm_build_c5_fixture.py \
            --clang "$(command -v clang)" \
            --lld-link "$(command -v lld-link)" \
            --output dist/c5-fixture/c5_game_fixture.exe

      - name: Run x87 compiled-C gate
        run: |
          node tests/xwasm_ci_runner.js \
            dist/x86-runtime-selftest/runtime.wasm \
            dist/x87-fixture/x87_float_fixture.exe \
            x87

      - name: Run C5 compiled-C gate
        run: |
          node tests/xwasm_ci_runner.js \
            dist/x86-runtime-selftest/runtime.wasm \
            dist/c5-fixture/c5_game_fixture.exe \
            c5
